<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mate0s · carta de tintas</title>
  <meta name="description" content="mate0s, desarrollador full stack, en una carta de colores: cada tinta es una parte de lo que hago.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='3' width='9' height='26' rx='2' fill='%23777BB3' transform='rotate(-14 16 28)'/%3E%3Crect x='11' y='3' width='9' height='26' rx='2' fill='%23F7DF1E'/%3E%3Crect x='18' y='3' width='9' height='26' rx='2' fill='%2300758F' transform='rotate(14 16 28)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --page: #ecece9;
      --ink: #17171a;
      --soft: #55565c;
      --chip: #fbfbf9;
      --accent: var(--ink);
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.55; }
    body { overflow-x: clip; }
    a { color: inherit; text-decoration-thickness: 2px; text-underline-offset: 4px; }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

    .page {
      min-height: 100dvh;
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 0 clamp(24px, 4vw, 64px);
      padding: clamp(16px, 3vw, 40px) clamp(16px, 4vw, 56px);
      max-width: 1440px;
      margin: 0 auto;
    }

    .head { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px 24px; border-bottom: 2px solid var(--ink); padding-bottom: 12px; }
    .brand { margin: 0; font-weight: 800; font-stretch: 112%; font-variation-settings: "wdth" 112; font-size: 26px; letter-spacing: -0.01em; }
    .brand span { font-weight: 400; font-stretch: 100%; font-variation-settings: "wdth" 100; font-size: 17px; color: var(--soft); margin-left: 10px; letter-spacing: 0; }
    .hint { font-size: 14px; color: var(--soft); }
    .hint kbd { font: inherit; border: 1.5px solid var(--soft); border-radius: 4px; padding: 0 5px; }

    /* ---------- Abanico ---------- */
    .fan-wrap { position: relative; min-height: 600px; touch-action: pan-y; cursor: grab; user-select: none; }
    .fan-wrap.dragging { cursor: grabbing; }
    .fan { position: absolute; left: 62%; bottom: 96px; width: 0; height: 0; }
    .chip {
      --w: clamp(112px, 11vw, 150px);
      --h: clamp(360px, 56dvh, 480px);
      position: absolute;
      left: calc(var(--w) / -2);
      bottom: calc(var(--w) * -0.2);
      width: var(--w);
      height: var(--h);
      transform-origin: 50% calc(100% - var(--w) * 0.2);
      border: 0;
      padding: 0;
      border-radius: 6px;
      background: var(--chip);
      box-shadow: 0 1px 0 rgb(0 0 0 / 0.08), 0 10px 24px -14px rgb(40 30 20 / 0.45);
      display: grid;
      grid-template-rows: 1fr auto;
      text-align: left;
      overflow: hidden;
      transition: transform 520ms var(--ease), opacity 300ms var(--ease);
      will-change: transform;
      cursor: pointer;
    }
    .fan-wrap.dragging .chip { transition: opacity 300ms var(--ease); }
    .swatch { background: var(--c); position: relative; }
    .say { position: absolute; left: 12px; right: 12px; top: 14px; font-weight: 800; font-stretch: 90%; font-variation-settings: "wdth" 90; font-size: clamp(22px, 2.2vw, 30px); line-height: 1; color: var(--ink); hyphens: manual; }
    .swatch.split { background: linear-gradient(var(--c) 0 50%, var(--c2) 50% 100%); }
    .label { padding: 10px 12px 34px; display: grid; gap: 2px; font-size: 13px; line-height: 1.2; color: var(--ink); }
    .label b { font-weight: 800; font-stretch: 88%; font-variation-settings: "wdth" 88; font-size: 16px; }
    .label span { font-variant-numeric: tabular-nums; color: var(--soft); letter-spacing: 0.02em; }
    /* agujero del tornillo */
    .chip::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: calc(var(--w) * 0.2 - 7px);
      width: 14px;
      height: 14px;
      margin-left: -7px;
      border-radius: 50%;
      background: var(--page);
      box-shadow: inset 0 1px 2px rgb(0 0 0 / 0.25);
    }
    .bolt { position: absolute; left: 62%; bottom: 96px; width: 22px; height: 22px; margin: 0 0 -11px -11px; border-radius: 50%; background: #9a9ba1; box-shadow: inset 0 -2px 0 rgb(0 0 0 / 0.25), 0 1px 2px rgb(0 0 0 / 0.3); z-index: 200; pointer-events: none; }

    /* ---------- Ficha técnica ---------- */
    .sheet { align-self: stretch; display: flex; flex-direction: column; justify-content: center; padding: 32px 0 32px clamp(0px, 2vw, 24px); min-width: 0; position: relative; z-index: 300; background: var(--page); box-shadow: -24px 0 24px -12px var(--page); }
    .sheet-swatch { height: clamp(90px, 16dvh, 160px); border-radius: 6px; background: var(--sel, #ccc); transition: background-color 420ms var(--ease); position: relative; }
    .sheet-swatch.split { background: linear-gradient(90deg, var(--sel) 0 50%, var(--sel2) 50% 100%); }
    .sheet-code { display: flex; justify-content: space-between; gap: 12px; margin: 12px 0 0; font-size: 14px; color: var(--soft); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
    .sheet h2 { margin: 18px 0 10px; font-weight: 800; font-stretch: 118%; font-variation-settings: "wdth" 118; font-size: clamp(34px, 3.6vw, 54px); line-height: 0.98; letter-spacing: -0.02em; }
    .sheet p { margin: 0 0 12px; max-width: 46ch; }
    .sheet .links { display: flex; flex-wrap: wrap; gap: 6px 22px; font-weight: 700; font-size: 19px; }
    .sheet .links a { min-height: 44px; display: inline-flex; align-items: center; }
    .sheet-body { transition: opacity 220ms var(--ease), transform 220ms var(--ease); }
    .sheet-body.swap { opacity: 0; transform: translateY(6px); }
    .nav { display: flex; gap: 8px; margin-top: 22px; }
    .nav button { font: 700 15px var(--font); background: transparent; border: 2px solid var(--ink); border-radius: 999px; padding: 8px 16px; min-height: 44px; cursor: pointer; }
    .nav button:hover { background: var(--ink); color: var(--page); }
    .count { margin-left: auto; align-self: center; font-variant-numeric: tabular-nums; color: var(--soft); font-size: 14px; }

    .foot { grid-column: 1 / -1; border-top: 2px solid var(--ink); padding-top: 12px; font-size: 13px; color: var(--soft); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

    @media (max-width: 860px) {
      .page { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto auto; }
      .fan-wrap { min-height: 440px; }
      .fan, .bolt { bottom: 70px; }
      .fan-wrap { overflow-x: clip; overflow-y: visible; }
      .hint .keys { display: none; }
      .chip { --w: 96px; --h: 330px; }
      .label { padding: 8px 8px 26px; font-size: 11px; }
      .label b { font-size: 13px; }
      .sheet { padding-top: 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 1ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="head">
      <h1 class="brand">mate0s<span>desarrollador full stack · carta de tintas</span></h1>
      <p class="hint">Arrastra el abanico o toca una muestra<span class="keys">; también con <kbd>←</kbd> <kbd>→</kbd></span></p>
    </header>

    <div class="fan-wrap" data-fan-wrap aria-label="Carta de colores">
      <div class="fan" role="group" aria-label="Muestras" data-fan></div>
      <div class="bolt" aria-hidden="true"></div>
    </div>

    <section class="sheet" aria-live="polite">
      <div class="sheet-swatch" data-sheet-swatch></div>
      <p class="sheet-code"><span data-sheet-code></span><span data-sheet-kind></span></p>
      <div class="sheet-body" data-sheet-body></div>
      <div class="nav">
        <button type="button" data-prev>Anterior</button>
        <button type="button" data-next>Siguiente</button>
        <span class="count" data-count></span>
      </div>
    </section>

    <footer class="foot"><span>Colores oficiales de cada tecnología cuando existen.</span><span>github.com/mate0sdev</span></footer>
  </div>

  <script>
    /* Edita aquí las muestras. c = color, c2 = segundo color (muestra partida). */
    const CONTACTO = { github: "https://github.com/mate0sdev", email: "", linkedin: "" };
    const TINTAS = [
      { name: "mate0s", kind: "Portada", c: "#6f8f2f", text: ["Desarrollador full stack.", "Esta carta reúne las tintas con las que trabajo. Cada muestra es una parte de lo que hago: pasa las páginas del abanico."] },
      { name: "Formación", kind: "Base", c: "#2f7d6f", text: ["Técnico Superior en Desarrollo de Aplicaciones Multiplataforma (DAM): escritorio, móvil y web."] },
      { name: "Experiencia", kind: "Trabajo", c: "#2b2d31", text: ["Full stack en Kometasoft: plataformas web de principio a fin, de la plantilla a la base de datos.", "Entre otros proyectos, he participado en SNP Galaxy."] },
      { name: "PHP", kind: "Servidor", c: "#777bb3", text: ["La lógica del servidor: la parte que no se ve y que no puede fallar."] },
      { name: "JavaScript", kind: "Navegador", c: "#f7df1e", text: ["Todo lo que se mueve en el navegador."] },
      { name: "HTML y CSS", kind: "Estructura", c: "#e34f26", c2: "#1572b6", text: ["Estructura y forma. Por eso esta muestra va partida en dos."] },
      { name: "Smarty", kind: "Plantillas", c: "#f4a41e", text: ["Plantillas .tpl: separar lo que se pinta de lo que se calcula."] },
      { name: "jQuery y AJAX", kind: "Peticiones", c: "#0769ad", text: ["Peticiones sin recargar la página y el DOM a mano, con oficio."] },
      { name: "Doctrine", kind: "ORM", c: "#fc6a31", text: ["Entidades y ORM para hablar con la base de datos con orden."] },
      { name: "MySQL", kind: "Datos", c: "#00758f", text: ["Donde acaba guardándose todo: consultas, índices y paciencia."] },
      { name: "Intereses", kind: "Rojo breakpoint", c: "#d7263d", text: ["Depuración y seguridad web: encontrar el porqué de un fallo, no solo dónde está, y que lo que funciona, además, aguante."] },
      { name: "Contacto", kind: "Última página", c: "#fbfbf9", contact: true, text: ["¿Un proyecto, una oferta o una charla? Aquí me encuentras."] },
    ];

    const fan = document.querySelector("[data-fan]");
    const wrap = document.querySelector("[data-fan-wrap]");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    const STEP = 7.5; // grados entre muestras
    let pos = 0; // posición continua del abanico (índice de la muestra al frente)
    let selected = -1;

    const chips = TINTAS.map((t, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.setAttribute("aria-label", `${t.name}, ${t.kind}`);
      b.innerHTML = `<div class="swatch${t.c2 ? " split" : ""}" style="--c:${t.c};--c2:${t.c2 || t.c}"></div><div class="label"><b>${t.name}</b><span>${t.c.toUpperCase()}${t.c2 ? " / " + t.c2.toUpperCase() : ""}</span></div>`;
      if (t.contact) {
        const sw = b.querySelector(".swatch");
        sw.style.boxShadow = "inset 0 0 0 1.5px #d4d4d0";
        sw.innerHTML = '<span class="say">¿Habla&shy;mos?</span>';
      }
      b.addEventListener("click", () => {
        if (moved) return;
        goTo(i);
      });
      fan.append(b);
      return b;
    });

    function layout() {
      chips.forEach((chip, i) => {
        const d = pos - i;
        const angle = d * STEP;
        const lift = Math.max(0, 1 - Math.abs(d)) * -34;
        chip.style.transform = `rotate(${angle}deg) translateY(${lift}px)`;
        chip.style.zIndex = String(100 - Math.round(Math.abs(d) * 2) + (d < 0 ? 1 : 0));
        chip.style.opacity = Math.abs(angle) > 82 ? "0" : "1";
        chip.tabIndex = i === Math.round(pos) ? 0 : -1;
        chip.setAttribute("aria-pressed", String(i === Math.round(pos)));
      });
      select(Math.round(Math.max(0, Math.min(TINTAS.length - 1, pos))));
    }

    const sheetSwatch = document.querySelector("[data-sheet-swatch]");
    const sheetBody = document.querySelector("[data-sheet-body]");
    function select(i) {
      if (i === selected) return;
      selected = i;
      const t = TINTAS[i];
      sheetSwatch.style.setProperty("--sel", t.c);
      sheetSwatch.style.setProperty("--sel2", t.c2 || t.c);
      sheetSwatch.classList.toggle("split", !!t.c2);
      sheetSwatch.style.boxShadow = t.contact ? "inset 0 0 0 1.5px #c9c9c4" : "none";
      sheetSwatch.innerHTML = t.contact ? '<span class="say">¿Hablamos?</span>' : "";
      document.querySelector("[data-sheet-code]").textContent = t.c.toUpperCase() + (t.c2 ? " / " + t.c2.toUpperCase() : "");
      document.querySelector("[data-sheet-kind]").textContent = t.kind;
      document.querySelector("[data-count]").textContent = `${String(i + 1).padStart(2, "0")} / ${TINTAS.length}`;
      const links = [];
      if (t.contact) {
        if (CONTACTO.email) links.push(`<a href="mailto:${CONTACTO.email}">${CONTACTO.email}</a>`);
        if (CONTACTO.linkedin) links.push(`<a href="${CONTACTO.linkedin}" target="_blank" rel="noopener">LinkedIn</a>`);
        links.push(`<a href="${CONTACTO.github}" target="_blank" rel="noopener">GitHub · mate0sdev</a>`);
      }
      const html = `<h2>${t.name}</h2>${t.text.map((p) => `<p>${p}</p>`).join("")}${links.length ? `<p class="links">${links.join("")}</p>` : ""}`;
      if (reduce.matches) return (sheetBody.innerHTML = html);
      sheetBody.classList.add("swap");
      clearTimeout(select.t);
      select.t = setTimeout(() => {
        sheetBody.innerHTML = html;
        sheetBody.classList.remove("swap");
      }, 160);
    }

    function goTo(i) {
      pos = Math.max(0, Math.min(TINTAS.length - 1, i));
      layout();
    }

    /* Arrastre: el ángulo del puntero respecto al tornillo gira el abanico */
    let dragging = false;
    let moved = false;
    let startX = 0;
    let startPos = 0;
    wrap.addEventListener("pointerdown", (e) => {
      dragging = true;
      moved = false;
      startX = e.clientX;
      startPos = pos;
    });
    window.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 4 && !moved) {
        moved = true;
        wrap.classList.add("dragging");
        wrap.setPointerCapture?.(e.pointerId);
      }
      if (!moved) return;
      pos = Math.max(-0.4, Math.min(TINTAS.length - 0.6, startPos + dx / 70));
      layout();
    });
    window.addEventListener("pointerup", () => {
      if (!dragging) return;
      dragging = false;
      wrap.classList.remove("dragging");
      if (moved) goTo(Math.round(pos));
      setTimeout(() => (moved = false), 0);
    });

    wrap.addEventListener("wheel", (e) => {
      if (Math.abs(e.deltaX) < Math.abs(e.deltaY) && !e.shiftKey) return;
      e.preventDefault();
      goTo(Math.round(pos) + Math.sign(e.deltaX || e.deltaY));
    }, { passive: false });

    document.addEventListener("keydown", (e) => {
      if (e.target.closest("a")) return;
      if (e.key === "ArrowRight") { goTo(Math.round(pos) + 1); chips[Math.round(pos)].focus({ preventScroll: true }); e.preventDefault(); }
      if (e.key === "ArrowLeft") { goTo(Math.round(pos) - 1); chips[Math.round(pos)].focus({ preventScroll: true }); e.preventDefault(); }
    });
    document.querySelector("[data-prev]").addEventListener("click", () => goTo(Math.round(pos) - 1));
    document.querySelector("[data-next]").addEventListener("click", () => goTo(Math.round(pos) + 1));

    // Entrada: el abanico se despliega desde cerrado
    if (!reduce.matches) {
      chips.forEach((c) => (c.style.transform = "rotate(0deg)"));
      requestAnimationFrame(() => requestAnimationFrame(() => { pos = 3; layout(); setTimeout(() => goTo(0), 380); }));
    } else layout();
  </script>
</body>
</html>
